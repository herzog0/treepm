version: 1
ideas:
  - id: IDEA-001
    created_at: 2026-11-04
    title: Árvore privada de tarefas do desenvolvedor
    status: proposed
    summary: >-
      Permitir que cada desenvolvedor tenha uma árvore privada com suas tarefas
      pessoais e do dia, separada das tarefas oficiais dos projetos.
    details:
      - A árvore reúne demandas próprias do desenvolvedor, incluindo tarefas de código e outras atividades que não pertencem diretamente a um projeto.
      - A IA do produto poderia analisar o Slack da pessoa e comentários dos projetos para identificar demandas.
      - A partir dessas informações, a IA criaria uma árvore das tarefas do dia do usuário, sem se limitar às tarefas oficiais do projeto.
    relationships: []
  - id: IDEA-002
    created_at: 2026-11-04
    title: Transformação contínua entre quadradinhos e tickets
    status: implemented
    summary: >-
      Fazer os indicadores dos filhos diretos se deslocarem e crescerem até
      virar os tickets correspondentes conforme o zoom, com caminho inverso
      contínuo ao afastar.
    details:
      - Cada filho mantém uma única representação; o quadradinho se transforma no ticket sem desaparecer ou ser duplicado.
      - Os filhos da geração seguinte aparecem como novos quadradinhos sob os tickets revelados.
      - Gestos longos, inversões rápidas e movimentos do ponteiro preservam a suavização e os deltas acumulados.
      - Grupos e elementos subpixel mudam de tamanho continuamente, sem reposicionamentos ou cortes abruptos.
      - Arrastar durante o zoom não acumula deslocamentos para aplicar depois.
    relationships: []
  - id: IDEA-003
    created_at: 2026-11-04
    title: Modo stand-up com roteiro e navegação animada
    status: proposed
    summary: >-
      Oferecer um modo de reunião stand-up com participantes predefinidos,
      roteiro de falas e navegação animada entre os tickets discutidos.
    details:
      - Ao ativar o modo stand-up, o PM encontra em um drop-down um preset das pessoas que participam da reunião.
      - Na organização por pessoa, o PM pode reordenar os participantes para definir a sequência das falas.
      - Um modo alternativo organiza a reunião por tarefas em progresso, levando em conta também o setor.
      - As tarefas podem ser agrupadas visualmente por setor e contexto, como uma borda de Engenharia ao redor dos cards correspondentes.
      - Outra possibilidade é ordenar por ticket ou subárvore, fazendo com que todas as pessoas envolvidas falem em ciclo.
      - Antes do início, o sistema apresenta o roteiro completo do stand-up, indicando quem falará, sobre o quê e em que momento.
      - Ao dar play, a navegação vai ao primeiro ticket do roteiro; o comando de avançar leva ao próximo ticket a ser discutido.
      - As transições entre tickets usam animações de navegação inspiradas no Prezi.
    relationships: []
  - id: IDEA-004
    created_at: 2026-11-04
    title: Navegação imediata com pan e zoom simultâneos
    status: implemented
    summary: >-
      Permitir que o usuário comece a arrastar imediatamente após o zoom,
      sem esperar animações, e combine wheel com drag para navegar pelo mapa.
    details:
      - Um novo clique e arraste assume a câmera exibida e interrompe a animação pendente sem salto.
      - Botões esquerdo e do meio fazem pan incremental imediato no fundo e sobre cards.
      - Wheel durante o arraste mantém o ganho acumulado e o ponto mundial sob o cursor, inclusive com Ctrl ou Meta.
      - Soltar o botão encerra o drag; perda temporária de captura não interrompe a navegação.
      - Clique para detalhes e proteção contra click acidental após drag continuam disponíveis.
      - Pan translada uma camada única e reaproveita a geometria e o conteúdo dos nós; a câmera responde ao zoom sem uma espera artificial após o gesto.
    relationships:
      - type: refines
        target: IDEA-002
  - id: IDEA-005
    created_at: 2026-11-04
    title: Criador inteligente de tasks com classificação pelo Jev
    status: proposed
    summary: >-
      Transformar uma descrição livre em uma task bem descrita e usar o Jev
      para percorrer a árvore até encontrar ou criar o lugar mais adequado.
    details:
      - O usuário descreve a task livremente e uma IA aprimora a descrição para deixar claro o que precisa ser feito.
      - A integração com o Jev procura na árvore e nas subárvores o ticket ao qual a nova tarefa pertence como subitem.
      - A busca começa com o primeiro nó e seus filhos, perguntando ao Jev qual filho melhor contempla a tarefa.
      - Depois de escolher um ticket, o sistema envia os filhos dele ao Jev e repete a pergunta, refinando a classificação em profundidade até encontrar o local mais adequado.
      - Se o Jev identificar a necessidade de uma categoria intermediária inexistente, o sistema pode criá-la com a ajuda dele para definir sua descrição.
      - A tarefa não deve ser forçada em um ramo quando nenhum filho do card atual a contemplar.
      - Quando nenhuma categoria do nível geral contemplar a tarefa, ela pode ser criada como um ticket geral, sem pai.
      - Complemento de 2026-11-19. Um botão de adicionar task, em algum ponto da tela do mapa, abre um painel lateral direito com um chat com a IA da plataforma.
      - A IA tem memória e um mapa mental de qual task está onde e sobre qual conteúdo.
      - Antes de procurar o caminho e criar a task de fato, a IA formata o texto e faz mais perguntas à pessoa.
      - A plataforma encontra o caminho até o local onde a task descrita no chat se enquadra como folha, testando do topo até a base qual ramo se enquadra melhor com o que a pessoa vai trabalhar.
    relationships:
      - type: related_to
        target: IDEA-013
      - type: related_to
        target: IDEA-014
  - id: IDEA-006
    created_at: 2026-11-04
    title: Reinício a partir da engine espacial
    status: implemented
    summary: >-
      Recomeçar a implementação mantendo só a engine que desenha a estrutura,
      seu fundo e sua lógica, com dados fictícios locais para demonstrá-la.
    details:
      - Remover implementações anteriores de produto e experiências alternativas.
      - Extrair um núcleo genérico independente de modelos de negócio e de serviços.
      - Preservar layout, LOD, culling, transformações entre indicadores e cards e navegação por pan e zoom.
      - Manter a ideia do TreePM como direção para reconstruir o produto sobre a nova base.
      - Separar o estado anterior e a extração em commits revisáveis no Git.
    relationships:
      - type: related_to
        target: IDEA-002
      - type: related_to
        target: IDEA-004
  - id: IDEA-007
    created_at: 2026-11-05
    title: Quadradinhos mesclados sem badge de quantidade
    status: implemented
    summary: >-
      Substituir o quadrado +N por pequenos representantes que mesclam alguns
      filhos e combinam suas cores pelo retorno de uma função configurável.
    details:
      - Particionar todos os filhos diretos em slots determinísticos e balanceados, preservando seus IDs.
      - Manter contagem e membros acessíveis sem um contador visual de overflow.
      - Separar mistura de cores da geometria headless e permitir que o consumidor substitua a função.
      - Preservar a transformação contínua e reversível entre grupos, indicadores e cards.
    relationships:
      - type: refines
        target: IDEA-002
  - id: IDEA-008
    created_at: 2026-11-05
    title: Árvore genérica e experiência espacial reutilizável
    status: implemented
    summary: >-
      Isolar uma estrutura de árvore bem tipada em TypeScript, com contratos
      genéricos implementados por consumidores futuros e apresentação substituível.
    details:
      - Separar interfaces de identidade e parentesco dos campos de conteúdo e de negócio.
      - Preservar o tipo concreto do consumidor no índice, layout, cena e renderers.
      - Separar o núcleo headless dos componentes React e estilos opcionais.
      - Parametrizar layout, compressão, indicadores, câmera, mistura, conteúdo e apresentação para reaproveitamento em outros projetos.
      - O futuro produto de gerenciamento de projetos será um consumidor da engine, sem definir o contrato mínimo dela.
    relationships:
      - type: refines
        target: IDEA-006
      - type: related_to
        target: IDEA-007
  - id: IDEA-009
    created_at: 2026-11-05
    title: Plataforma de tickets multidisciplinar sobre a engine espacial
    status: proposed
    summary: >-
      Planejar uma plataforma de gerenciamento de projetos que usa a mecânica
      espacial como base, com trabalho multidisciplinar compartilhado em cada ticket.
    details:
      - Nesta etapa, produzir apenas business blueprint, catálogo de features e plano de implementação da plataforma.
      - Um único ticket aceita múltiplas pessoas assinaladas e descrições de cada área envolvida.
      - Conversas podem ser globais ou contextualizadas por área no mesmo ticket.
      - Incluir busca semântica, seleção de resultados que navega ao contexto, filtros e suas visualizações.
      - Planejar modo stand-up e integrar as ideias anteriores do registro.
      - Definir informação de cards por grau de compressão e representação de relações cruzadas.
      - Explorar como Jev e IA ajudam classificação, organização e rotina de trabalho.
      - Planejar login com Clerk, isolamento multi-tenant, administração de times e capacidades essenciais de gerenciamento de projetos.
      - Blueprint em docs/product-blueprint.md; capacidades de Clerk e Jev verificadas em docs/research/platform-services.md.
    relationships:
      - type: depends_on
        target: IDEA-008
      - type: related_to
        target: IDEA-001
      - type: related_to
        target: IDEA-003
      - type: related_to
        target: IDEA-005
  - id: IDEA-010
    created_at: 2026-11-05
    title: Importação de tasks com categorização automática opcional
    status: proposed
    summary: >-
      Importar tarefas dos principais gerenciadores do mercado e oferecer
      categorização automática como um recurso opcional de custo adicional.
    details:
      - Permitir a importação de tasks de GitHub, Jira, Linear e outros gerenciadores de tarefas.
      - Oferecer categorização automática das tarefas importadas como uma opção para o usuário.
      - Informar que o processamento adicional terá um custo, cabendo ao usuário optar por pagar para utilizá-lo.
    relationships:
      - type: related_to
        target: IDEA-005
  - id: IDEA-011
    created_at: 2026-11-05
    title: Estimativas automáticas de execução e revisão de PR
    status: proposed
    summary: >-
      Estimar o tempo das tarefas com dados históricos e IA, medindo
      separadamente a execução até a abertura do PR e o tempo de revisão.
    details:
      - Medir o tempo de execução desde a entrada do ticket em progresso até a abertura do PR, sem incluir o tempo de revisão nesse intervalo.
      - Analisar dados como comentários do ticket, código do PR, complexidade e quantidade de linhas alteradas para embasar as estimativas.
      - Atribuir scores de complexidade, risco e incerteza, usando incerteza como o terceiro critério para representar ambiguidades e informações insuficientes.
      - Calibrar progressivamente as estimativas com os tempos observados, buscando prever a duração do trabalho independentemente de quem executou a tarefa.
      - Coletar separadamente o tempo médio de revisão dos PRs e incluí-lo na estimativa geral de cada task e do produto.
      - Manter um campo de estimativa nos metadados do ticket, preenchido pela IA em vez de exigir que o usuário o informe.
      - Exibir uma estimativa provisória durante a calibragem e informar claramente ao usuário que as estimativas serão refinadas com o tempo.
    relationships:
      - type: refines
        target: IDEA-009
      - type: related_to
        target: IDEA-010
  - id: IDEA-012
    created_at: 2026-11-09
    title: Visão geral em BPMN com análise de regras de negócio
    status: proposed
    summary: >-
      Complementar a visão geral em árvore com um modelo BPMN gerado a partir
      das regras de negócio aprendidas pela IA, destacando pontos de falha e gaps.
    details:
      - Assim como a estrutura de árvore oferece uma visão geral do projeto, um modelo BPMN poderia oferecer uma visão geral dos processos e regras de negócio.
      - O modelo BPMN seria renderizado de acordo com as regras de negócio aprendidas pela IA do projeto.
      - A visualização alertaria sobre pontos de falha, gaps e outros problemas identificados.
    relationships:
      - type: depends_on
        target: IDEA-009
  - id: IDEA-013
    created_at: 2026-11-19
    title: Abrir ticket com deslize, página lateral e foco no mapa
    status: proposed
    summary: >-
      Abrir um ticket desliza o mapa para a esquerda, abre uma página lateral
      com mais detalhes e leva a câmera a um zoom grande no ticket.
    details:
      - Ao abrir um ticket, o mapa desliza para a esquerda.
      - Uma página lateral se abre com mais detalhes do ticket.
      - O mapa foca no ticket aberto, com zoom grande nele.
      - "Em 2026-11-20: o clique continua selecionando; o ticket abre por Enter, segundo clique ou botão Abrir."
    relationships:
      - type: refines
        target: IDEA-004
      - type: related_to
        target: IDEA-009
  - id: IDEA-014
    created_at: 2026-11-19
    title: Reclassificação do ticket quando a edição muda a categoria
    status: proposed
    summary: >-
      Editar o conteúdo de uma task é possível; se a alteração mudar a
      categoria da task, a mudança de pai tem que acontecer.
    details:
      - A edição do conteúdo de uma task é possível.
      - Se o conteúdo for alterado a ponto de a task mudar de categoria, isto é, mudar de pai, essa mudança tem que acontecer.
      - "Em 2026-11-20: a mudança é confirmada ao salvar e, se realmente fizer sentido, não deixa salvar sem mudar de lugar primeiro."
    relationships:
      - type: refines
        target: IDEA-005
  - id: IDEA-015
    created_at: 2026-11-20
    title: Página de configurações com preferências por usuário
    status: proposed
    summary: >-
      Comportamentos de interface que são questão de gosto ficam sob controle
      de cada usuário, em uma página de configurações com seções.
    details:
      - Ao fechar um ticket, a câmera volta ao lugar de antes; isso é uma configuração, na seção Câmera.
      - O usuário tem controle sobre todo esse tipo de coisa, a nível de usuário e não de plataforma.
    relationships:
      - type: related_to
        target: IDEA-013
  - id: IDEA-016
    created_at: 2026-11-20
    title: Zoom como controle do detalhe de informação
    status: proposed
    summary: >-
      O nível máximo de zoom mostra todo o conteúdo de um card folha, grande,
      com texto maior, descrição e pessoas.
    details:
      - O zoom máximo permite ver todo o conteúdo de um card folha, grande, como se vê um card pai quando os filhos já aparecem.
      - O card grande é um card de detalhe, com texto maior, descrição e pessoas.
      - Zoom é controle de detalhe de informação.
    relationships:
      - type: refines
        target: IDEA-004
  - id: IDEA-017
    created_at: 2026-11-20
    title: Agrupadores como tipo próprio na árvore
    status: proposed
    summary: >-
      Separar tickets de agrupadores: o card pai não é exatamente um ticket,
      é um agrupador que engloba uma subárvore e representa um mini produto.
    details:
      - Um agrupador engloba uma subárvore de tickets que, juntos, representam um mini produto, como "Entrega da Fase 1".
      - Só agrupador tem filhos; agrupadores ficam dentro de agrupadores sem limite.
      - A IA também forma agrupadores: ao criar um ticket, identifica um possível agrupamento com tickets que já existem, propõe o agrupador e a pessoa confirma.
      - Decidido por Teodoro em 2026-11-20 e registrado na ADR 0031.
    relationships:
      - type: refines
        target: IDEA-005
  - id: IDEA-018
    created_at: 2026-11-20
    title: Procura do lugar do ticket só na subárvore do agrupador selecionado
    status: proposed
    summary: >-
      Quando a pessoa cria um ticket com um agrupador selecionado, a IA busca
      o lugar só dentro dele, o que resolve a ambiguidade do nível mais alto.
    details:
      - A pessoa resolve a decisão mais ambígua (qual agrupador) e a IA refina dali para baixo.
      - Criar ticket sem agrupador selecionado continua permitido, com a procura a partir da raiz do projeto.
      - Decidido por Teodoro em 2026-11-20 e registrado na ADR 0031.
    relationships:
      - type: refines
        target: IDEA-005
      - type: related_to
        target: IDEA-017
  - id: IDEA-019
    created_at: 2026-11-20
    title: Hidratação do ticket novo por uma IA
    status: proposed
    summary: >-
      Todo ticket novo passa por uma IA que analisa o pedido, verifica quanto
      envolve de back-end, front-end e outras áreas, e define melhor cada parte.
    details:
      - A IA executa procedimentos de criação de ticket e devolve um ticket mais completo.
      - Um ticket mais completo é mais fácil de categorizar e vira contexto melhor para os seguintes.
      - Sem acesso ao código, a análise por área depende de perguntar à pessoa; com repositório ligado (IDEA-020), pode se apoiar no código.
      - Em 2026-11-20 ficou combinado tratar a análise por área junto das contribuições por área da Fase 2.
    relationships:
      - type: related_to
        target: IDEA-005
      - type: related_to
        target: IDEA-020
  - id: IDEA-020
    created_at: 2026-11-20
    title: Ligação com repositórios de código (GitHub primeiro)
    status: proposed
    summary: >-
      Plugar GitHub, GitLab e talvez Bitbucket para rastrear branches e dar
      visibilidade geral do repositório a partir da plataforma.
    details:
      - Começar pelo GitHub; GitLab e Bitbucket depois, se for fácil conectar todos.
      - Rastreio de branch e visibilidade geral do repositório a partir da plataforma.
      - A IA da plataforma passa a poder consultar o código para hidratar tickets.
      - Enviar código a um provedor de IA exige autorização própria, fora do que a ADR 0029 autorizou.
      - Em 2026-11-21 Teodoro autorizou enviar trechos de código à Anthropic, desde que isso seja aceito pelo usuário nos termos de uso ou na privacidade do site; sem esse aceite nada é enviado (ADR 0032).
    relationships:
      - type: related_to
        target: IDEA-019
      - type: related_to
        target: IDEA-011
