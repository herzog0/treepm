# PostgreSQL só para os testes de @treepm/db. Contêiner e porta próprios:
# não toca em outros bancos da máquina.
name: treepm-test
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: treepm-test-postgres
    environment:
      POSTGRES_USER: treepm_owner
      POSTGRES_PASSWORD: treepm_owner_test
      POSTGRES_DB: treepm_test
      # A imagem Debian do pgvector nasce com en_US.utf8; a alpine antiga ordenava como C, e os testes contam com isso.
      POSTGRES_INITDB_ARGS: "--locale=C"
    ports:
      - "127.0.0.1:54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treepm_owner -d treepm_test"]
      interval: 1s
      timeout: 3s
      retries: 30
