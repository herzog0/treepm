# O nome do app é provisório: `fly apps create` ainda não foi executado e o nome
# pode já estar em uso na Fly (os nomes são globais). Ajustar antes do primeiro deploy.
app = "treepm"
primary_region = "gru" # São Paulo, junto do Neon (ADR 0022)

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Chave PÚBLICA do Clerk (pk_...), embutida no bundle do web. O valor NÃO é
    # versionado: é passado no deploy com
    #   fly deploy --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_live_...
    # (argumentos de build não existem no contêiner em runtime).
    VITE_CLERK_PUBLISHABLE_KEY = ""

[env]
  # Só valores não secretos. Secrets (CLERK_SECRET_KEY, CLERK_PUBLISHABLE_KEY,
  # DATABASE_URL) ficam em `fly secrets`; ver docs/deploy.md.
  NODE_ENV = "production"
  PORT = "4310"
  WEB_DIST_DIR = "/app/web"
  APP_ORIGIN = "https://treepm.ai"
  # A documentação da Fly diz que o proxy define este cabeçalho, mas não diz que sobrescreve o que o cliente mandar;
  # a conferência é feita depois da publicação (docs/deploy.md, "Primeiro deploy", passo 7).
  CLIENT_IP_HEADER = "Fly-Client-IP"

# Sem [deploy] release_command, de propósito (ADR 0021): as migrações rodam FORA da Fly,
# antes de cada deploy, com DATABASE_MIGRATION_URL só no ambiente do mantenedor ou do CI.
# Na Fly secrets valem para todas as máquinas do app (inclusive a do release_command),
# então esse secret nunca é criado lá. A imagem não contém o CLI do prisma nem as
# migrações. Ver docs/deploy.md.

[http_service]
  internal_port = 4310
  force_https = true
  # Custo mínimo: a máquina para sem tráfego e acorda na primeira requisição;
  # nenhuma fica ligada de graça (a primeira requisição paga o cold start).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    protocol = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  # shared-cpu-1x com 512 MB. Medido em 2026-11-22: cerca de 200 MiB com o banco em uso;
  # 256 MB (o menor preset) deixava pouca folga. Ver docs/deploy.md.
  size = "shared-cpu-1x"
  memory = "512mb"
